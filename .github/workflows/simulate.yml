name: Simulate

run-name: "Simulate ${{ inputs.tag }}, segment ${{ inputs.segment }} (focus ${{ inputs.focus }} cm, z_max ${{ inputs.z_max || 'none' }})"

# One run is one segment of a chain. A segment stops itself before the job time limit or when the disk
# is nearly full, saves a checkpoint as an artifact and dispatches the next segment, which resumes from it.
# Small result files are streamed to the release sim-<tag> while the segment runs; kw_THz goes to the
# artifact kw-<tag>-segNN.
on:
  workflow_dispatch:
    inputs:
      z_max:
        description: "Stop distance --z-max, cm (empty = no limit, the chain ends at max_segments)"
        required: false
        default: "30"
      focus:
        description: "Focal distance, cm (compiled in; pinned for the whole chain)"
        required: true
        default: "20"
      tag:
        description: "Chain name (letters, digits, . _ -): release sim-<tag>, artifacts kw-<tag>-segNN"
        required: true
        default: "z30"
      segment:
        description: "Segment number (1 starts a new chain; later segments are dispatched automatically)"
        required: true
        default: "1"
      resume_run_id:
        description: "Run id of the previous segment (for segment > 1)"
        required: false
        default: ""
      code_sha:
        description: "Commit to build (empty = the selected branch; pinned for the whole chain)"
        required: false
        default: ""
      budget_minutes:
        description: "Wall-clock budget of one segment from job start, minutes (GitHub kills jobs at 360)"
        required: true
        default: "330"
      max_segments:
        description: "Do not dispatch segments beyond this number"
        required: true
        default: "15"
      run_tests:
        description: "Run ctest before the simulation"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: simulate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      RELEASE: sim-${{ inputs.tag }}
      SEGMENT: ${{ inputs.segment }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      Z_MAX: ${{ inputs.z_max }}
      FOCUS: ${{ inputs.focus }}
      BUDGET: ${{ inputs.budget_minutes }}
      MAX_SEGMENTS: ${{ inputs.max_segments }}
      RUN_TESTS: ${{ inputs.run_tests }}
      # Minutes kept after the simulation for the last streaming pass, packing and uploads
      # (a full disk of kw_THz, ~70 GB, packs in ~13 min and uploads in ~4 min).
      RESERVE: "25"
      # The simulation stops with a checkpoint when less is free: room for one more snapshot (1.35 GB),
      # the checkpoint (0.7 GB) and packing.
      MIN_FREE_GB: "6"
      OMP_PROC_BIND: close
      OMP_PLACES: cores
    steps:
      - name: Start clock and check inputs
        run: |
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          [[ "$SEGMENT" =~ ^[0-9]+$ && "$SEGMENT" -ge 1 ]] || { echo "::error::bad segment '$SEGMENT'"; exit 1; }
          if [ "$SEGMENT" -gt 1 ] && [ -z "$RESUME_RUN_ID" ]; then
            echo "::error::segment $SEGMENT needs resume_run_id"; exit 1
          fi
          num='^[0-9]+(\.[0-9]+)?$'
          [ -z "$Z_MAX" ] || [[ "$Z_MAX" =~ $num ]] || { echo "::error::bad z_max '$Z_MAX'"; exit 1; }
          [[ "$FOCUS" =~ $num ]] || { echo "::error::bad focus '$FOCUS'"; exit 1; }
          printf 'SEG2=%02d\n' "$SEGMENT" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code_sha || github.sha }}

      - name: Record commit
        run: echo "CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell || true
          df -h .

      - name: Install FFTW3, OpenBLAS and pigz
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenblas-dev pigz

      - name: Configure
        run: cmake --preset fftw-openblas -DUPPE_FOCUS_CM="$FOCUS"

      - name: Build
        run: cmake --build --preset fftw-openblas -j "$(nproc)"

      - name: Test
        if: ${{ inputs.run_tests }}
        run: ctest --preset fftw-openblas

      - name: Prepare release and checkpoint
        run: |
          mkdir -p run
          if [ "$SEGMENT" -eq 1 ]; then
            if gh release view "$RELEASE" > /dev/null 2>&1; then
              echo "::error::Release $RELEASE already exists: choose another tag or delete the release and its tag"
              exit 1
            fi
            gh release create "$RELEASE" --prerelease --target "$CODE_SHA" \
              --title "Simulation $TAG (focus $FOCUS cm, z_max ${Z_MAX:-none})" \
              --notes "Commit $CODE_SHA. Small result files are streamed here; kw_THz is in the artifacts kw-$TAG-segNN of every segment run."
          else
            prev=$(printf '%02d' $((SEGMENT - 1)))
            gh run download "$RESUME_RUN_ID" -n "ckpt-$TAG-seg$prev" -D run
            ls -l run run/res
          fi

      - name: Simulate
        run: |
          nproc
          free -h
          df -h .
          elapsed=$(( ($(date +%s) - T0) / 60 ))
          limit=$(( BUDGET - elapsed - RESERVE ))
          if [ "$limit" -lt 5 ]; then echo "::error::budget too small: $limit min left for the simulation"; exit 1; fi
          echo "Simulation wall limit: $limit min"
          resume=()
          if [ "$SEGMENT" -gt 1 ]; then resume=(--resume run/checkpoint.bin); fi
          zmax=()
          if [ -n "$Z_MAX" ]; then zmax=(--z-max "$Z_MAX"); fi
          log="run/log_seg$SEG2.txt"

          bash ci/stream_results.sh run "$SEG2" 600 > stream.log 2>&1 &
          streamer=$!

          set +e
          timeout --preserve-status --signal=TERM --kill-after=5m "$((limit + 10))m" \
            ./build/fftw-openblas/uppe_thz_dc --data-dir data --out-dir run "${zmax[@]}" --threads "$(nproc)" \
            --wall-limit-min "$limit" --min-free-gb "$MIN_FREE_GB" --checkpoint run/checkpoint.bin "${resume[@]}" \
            2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          echo "SIM_CODE=$code" >> "$GITHUB_ENV"
          echo "Simulation exit code: $code"

          touch run/.stream_stop
          wait "$streamer" || true
          cat stream.log
          df -h .
          du -sh run

      - name: Pack kw_THz
        if: always()
        run: |
          if compgen -G "run/res/kw_THz/*.dat" > /dev/null; then
            extra=()
            [ -f "run/log_seg$SEG2.txt" ] && extra=("log_seg$SEG2.txt")
            # Packed files are deleted as they go, so a nearly full disk still has room for the archive.
            tar -I pigz --remove-files -cf kw.tar.gz -C run res/kw_THz "${extra[@]}"
            ls -lh kw.tar.gz
          fi

      - name: Upload kw_THz
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kw-${{ inputs.tag }}-seg${{ env.SEG2 }}
          path: kw.tar.gz
          if-no-files-found: ignore
          retention-days: 90
          compression-level: 0

      - name: Upload checkpoint
        if: env.SIM_CODE == '75'
        uses: actions/upload-artifact@v7
        with:
          name: ckpt-${{ inputs.tag }}-seg${{ env.SEG2 }}
          path: |
            run/checkpoint.bin
            run/res/Imax.dat
            run/res/Nemax.dat
            run/res/Energy.dat
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

      - name: Dispatch next segment
        if: env.SIM_CODE == '75'
        run: |
          next=$((SEGMENT + 1))
          if [ "$next" -gt "$MAX_SEGMENTS" ]; then
            echo "::warning::max_segments = $MAX_SEGMENTS reached; continue manually with segment=$next resume_run_id=$GITHUB_RUN_ID code_sha=$CODE_SHA"
            exit 0
          fi
          gh workflow run simulate.yml --ref "$GITHUB_REF_NAME" \
            -f z_max="$Z_MAX" -f focus="$FOCUS" -f tag="$TAG" -f segment="$next" -f resume_run_id="$GITHUB_RUN_ID" \
            -f code_sha="$CODE_SHA" -f budget_minutes="$BUDGET" -f max_segments="$MAX_SEGMENTS" -f run_tests="$RUN_TESTS"
          echo "Dispatched segment $next"

      - name: Report
        if: always()
        run: |
          z=$(tail -n 1 run/res/Imax.dat 2> /dev/null | awk '{print $1}')
          case "${SIM_CODE:-}" in
            0) state="z_max reached, chain finished" ;;
            75) state="stopped with a checkpoint" ;;
            *) state="FAILED (exit code ${SIM_CODE:-none})" ;;
          esac
          line="segment $SEG2, run $GITHUB_RUN_ID: z = ${z:-?} cm, $state"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$RELEASE" > /dev/null 2>&1; then
            body=$(gh release view "$RELEASE" --json body -q .body)
            gh release edit "$RELEASE" --notes "$body"$'\n'"- $line" || true
            if [ "${SIM_CODE:-}" = "0" ]; then
              echo "$line" > DONE.txt
              gh release upload "$RELEASE" DONE.txt --clobber
            fi
          fi
          if [ "${SIM_CODE:-}" != "0" ] && [ "${SIM_CODE:-}" != "75" ]; then exit 1; fi
